name: CI

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck + jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Shellcheck
        run: shellcheck -e SC2016 scripts/forklift scripts/install.sh tests/test.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y jq openssl gnupg
      - name: Run tests
        run: bash tests/test.sh
